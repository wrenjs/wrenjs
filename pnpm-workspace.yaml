allowBuilds:
  esbuild: true
  workerd: true

catalog:
  "@types/node": 26.6.5
  czg: ^1.14.0
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

catalogs:
  adapter-cloudflare:
    "@cloudflare/vite-plugin": 1.65.0

  benchmarks:
    "@types/autocannon": "7.12.7"
    "autocannon": "8.0.0"

  integration-preact:
    preact: "11.0.2"
    preact-render-to-string: "6.8.1"
    "@prefresh/vite": "4.0.1"
  integration-peers-preact:
    "preact": "^11.0.2"

  integration-ssx:
    "@lumeland/ssx": "0.1.16"
  integration-peers-ssx:
    "@lumeland/ssx": "^0.1.16"

  integration-react:
    "@types/react-dom": 19.3.0
    "@types/react": 19.3.0
    "@vitejs/plugin-react": 6.1.2
    "@vitejs/plugin-rsc": 0.5.38
    react-dom: 19.3.1
    react: 19.3.1
    oxc-transform-react: 0.155.0
  integration-peers-react:
    "react": "^19.3.1"
    "react-dom": "^19.3.1"

  lint:
    eslint-plugin-perfectionist: 5.13.0
    eslint-plugin-sonarjs: 4.2.2

  runtime:
    vite: 8.3.5

catalogMode: prefer

overrides:
  "react-dom@*": "catalog:integration-react"
  "react@*": "catalog:integration-react"
  vite: "catalog:"

packages:
  - apps/*
  - benchmarks/*
  - benchmarks/**/wren*
  - packages/adapters/*
  - packages/core
  - packages/integrations/*
  - tests/**/*

peerDependencyRules:
  allowAny:
    - vite
    - "@wren-js/core"
  allowedVersions:
    vite: "*"
    "@wren-js/core": "*"

publishBranch: trunk

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0 || 1.4.0"
  - vite-plus@1.3.0 || 1.4.0
