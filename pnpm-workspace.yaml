allowBuilds:
  esbuild: true
  workerd: true

catalog:
  "@slowpoketail/oxc": "1.8.0"
  "@types/node": "26.6.6"
  "czg": "^1.14.0"
  "typescript": "7.0.2"
  "vite-plus": 1.5.1
  "vite": npm:@voidzero-dev/vite-plus-core@1.5.1

catalogs:
  adapter-cloudflare:
    "@cloudflare/vite-plugin": "1.68.0"

  benchmarks:
    "@types/autocannon": "7.12.7"
    "autocannon": "9.0.0"

  integration-preact:
    "@pracht/preact-ssr-precompile": "0.1.5"
    "@prefresh/vite": "4.0.1"
    preact-render-to-string: "6.8.2"
    preact: "11.2.0"

  integration-peers-preact:
    "preact": "^11.2.0"

  integration-ssx:
    "@lumeland/ssx": "0.1.16"
  integration-peers-ssx:
    "@lumeland/ssx": "^0.1.16"

  integration-react:
    "@types/react-dom": "19.3.0"
    "@types/react": "19.3.0"
    "@vitejs/plugin-react": "6.3.0"
    "@vitejs/plugin-rsc": "0.5.39"
    oxc-transform-react: "0.158.0"
    react-dom: "19.3.1"
    react: "19.3.1"
  integration-peers-react:
    "react": "^19.3.1"
    "react-dom": "^19.3.1"

  runtime:
    "vite": "8.3.7"

catalogMode: prefer

overrides:
  "react-dom@*": "catalog:integration-react"
  "react@*": "catalog:integration-react"
  vite: "catalog:"

packages:
  - apps/*
  - benchmarks/*
  - benchmarks/**/wren*
  - packages/adapters/*
  - packages/core
  - packages/integrations/*
  - tests/**/*

peerDependencyRules:
  allowAny:
    - vite
    - "@wrenjs/core"
  allowedVersions:
    vite: "*"
    "@wrenjs/core": "*"

publishBranch: trunk

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.0"
  - vite-plus@1.5.0
